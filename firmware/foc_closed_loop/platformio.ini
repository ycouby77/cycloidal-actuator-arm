; foc_closed_loop: SimpleFOC closed loop on the bare stepper (L298N + AS5047P)

[env:nucleo_g474re]
platform = ststm32
; STM32 core 2.12.0, the last 2.x. SimpleFOC 2.4.0 doesn't build on core 3.0
; (enableTimerClock() signature changed). Same pin as foc_sensor_test.
platform_packages = platformio/framework-arduinoststm32@~4.21200.0
board = nucleo_g474re
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes

lib_deps =
    askuric/Simple FOC

; SimpleFOC needs this on STM32, or the linker can drop its hardware-specific PWM code
lib_archive = false