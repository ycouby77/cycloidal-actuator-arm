; Open-loop stepping with the AS5047P watching the shaft.
; Compares commanded steps to measured encoder counts.
 
[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = arduino
monitor_speed = 115200
 
; Shared encoder library at firmware/lib/AS5047P (path is relative to this folder)
lib_deps = symlink://../lib/AS5047P
 