; actuator: SimpleFOC closed loop through the 25:1 cycloid, driven by the line protocol
; in docs/protocol.md. The host GUI (host/actuator_gui) talks to this firmware.

[env:nucleo_g474re]
platform = ststm32
; STM32 core 2.12.0, the last 2.x. SimpleFOC 2.4.0 doesn't build on core 3.0
; (enableTimerClock() signature changed). Same pin as foc_closed_loop.
platform_packages = platformio/framework-arduinoststm32@~4.21200.0
board = nucleo_g474re
framework = arduino

; 460800 so telemetry streaming at 100-200 Hz never fills the UART.
; The ST-LINK V3 virtual COM port handles this rate fine.
monitor_speed = 460800
monitor_eol = LF
monitor_echo = yes

; Bigger serial buffers (default is 64 bytes). One telemetry line is ~60 chars,
; and the firmware only prints when the whole line fits, so FOC never blocks on Serial.
build_flags =
    -DSERIAL_TX_BUFFER_SIZE=512
    -DSERIAL_RX_BUFFER_SIZE=256

lib_deps =
    askuric/Simple FOC@2.4.0

; SimpleFOC needs this on STM32, or the linker can drop its hardware-specific PWM code
lib_archive = false
